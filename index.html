<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/logo.webp" />
    <meta name="facebook-domain-verification" content="bzydqj1xoppkq675igwxl2fe4p4fp6" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Automatizate</title>
    <!-- Meta Pixel Code -->
    <script>
    !function (w, d) {
      if (w.fbq) return;
      const queue = [];
      const fbq = function () {
        if (fbq.callMethod) {
          fbq.callMethod.apply(fbq, arguments);
          return;
        }
        queue.push(arguments);
      };
      fbq.push = fbq;
      fbq.queue = queue;
      fbq.loaded = true;
      fbq.version = '2.0';
      w.fbq = fbq;
      if (!w._fbq) w._fbq = fbq;

      const loadPixel = () => {
        if (loadPixel.loaded) return;
        loadPixel.loaded = true;
        const script = d.createElement('script');
        script.async = true;
        script.src = 'https://connect.facebook.net/en_US/fbevents.js';
        d.head.appendChild(script);
      };

      fbq('init', '1279717514252543');
      fbq('track', 'PageView');
      fbq('track', 'ViewContent');

      if ('requestIdleCallback' in w) {
        w.requestIdleCallback(loadPixel, { timeout: 3000 });
      } else {
        w.addEventListener('load', loadPixel, { once: true });
      }
    }(window, document);
    </script>
    <!-- End Meta Pixel Code -->
  </head>
  <body>
    <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=1279717514252543&ev=PageView&noscript=1"
    /></noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
